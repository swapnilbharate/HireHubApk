# Database Configuration (reads from env vars on Render, falls back to localhost for local dev)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-restless-snow-axvrobhs.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_9w5hiVtWdmqA}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SQL Init - DISABLED to preserve data between restarts
# Set to 'always' ONLY for first-time setup or to reset seed data
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# File Upload Settings
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT Secrets & Expiration (1 Year = 31536000000 ms)
hirehub.jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
hirehub.jwt.expiration-ms=31536000000

# Server Port
server.port=8081

# Logging Level
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# Gemini API Key (optional system environment override)
gemini.api.key=${GEMINI_API_KEY:default}
